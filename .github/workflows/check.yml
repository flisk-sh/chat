name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Workflow pins and timeouts
        run: node scripts/check-workflow-hygiene.mjs
      - name: Every corner radius is the sharp token
        run: node scripts/check-radius.mjs
      - name: Radius gate tests
        run: node --test scripts/*.test.mjs
      - name: Answer scorers agree with the labelled answers, and the loop keeps only real gains
        run: node --test evals/answers/*.test.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - name: Unit tests (the bigger-app test starts the generated services with node)
        run: bun test test
