# Measures this repo's north star (north_star.measure in docs/gel.json) every Monday and publishes the number, with this
# run's link, to the north-star branch. The GEL north-star guard and Cilytics read it there. A missed target turns the run red.
name: North star

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: north-star
  cancel-in-progress: false

jobs:
  measure:
    permissions:
      contents: write
    uses: flisk-sh/gel/.github/workflows/north-star.yml@15df52e9c5afa17814fdb336588e677f72feb40a # v1.17.0 (+next-cta)
    with:
      gel_ref: 15df52e9c5afa17814fdb336588e677f72feb40a
      timeout: 10
    secrets:
      measure_secret: ${{ secrets.FLISK_ANALYTICS_KEY }}
