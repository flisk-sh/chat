# chat.flisk.si: sign in with GitHub, type a task, a model plans it, a computer from fleet does it.
name = "flisk-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "chat.flisk.si", custom_domain = true }]

# Hourly: delete computers past their time (shared apps after 7 days, leftovers of crashed tasks). src/index.js cleanPods.
[triggers]
crons = ["17 * * * *"]

[vars]
PUBLIC_ORIGIN = "https://chat.flisk.si"
FLEET_URL = "https://fleet.flisk.si"
INFERENCE_URL = "https://inference.flisk.si/v1/chat/completions"
INFERENCE_MODEL = "flisk-wolf-chat"

# The free model is the flisk-inference Worker on our own domain: a direct link, because a Worker cannot call another
# Worker by its public address on the same domain (Cloudflare error 1033).
[[services]]
binding = "INFERENCE"
service = "flisk-inference"

# Speech to text for the mic button (Whisper), on the account's Workers AI.
[ai]
binding = "AI"

# Made sites. Create once: bunx wrangler@4 d1 create flisk-chat, put its id below, then
#   bunx wrangler@4 d1 execute flisk-chat --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "flisk-chat"
database_id = "fea52917-992e-4d99-98c9-cf007f233fd7"

# Secrets: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET (OAuth app, callback https://chat.flisk.si/auth/callback),
# SESSION_SECRET (long random), FLEET_SERVICE_SECRET (same value as CHAT_SERVICE_SECRET on fleet, 32+ characters),
# INFERENCE_KEY (one key from inference.flisk.si; chat counts each person's tasks itself).
# Optional OPENROUTER_KEY (a free key from openrouter.ai/keys): when free Flisk Wolf is out of its daily budget, the
# free choice falls back to OpenRouter's free models, then to a small Workers AI model (src/loop.js modelFrom).

# PR reviews ("@flisk-chat review"): a GitHub App with webhook https://chat.flisk.si/github/webhook, permissions Pull requests
# read+write, Issues read+write, Contents read, Metadata read, events "Issue comment" and "Pull request" (the second one only for automatic reviews). Secrets: GITHUB_APP_ID, GITHUB_APP_KEY
# (the .pem made PKCS#8: openssl pkcs8 -topk8 -nocrypt -in app.pem), GITHUB_WEBHOOK_SECRET, KEY_SECRET (long random; it
# encrypts saved AI keys, so never change it). Then: bunx wrangler@4 d1 execute flisk-chat --remote --file schema.sql
